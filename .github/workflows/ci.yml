name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scan-reprint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Record complete dependency audit
        continue-on-error: true
        run: mkdir -p artifacts && npm audit --json > artifacts/dependency-audit.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Real Electron UI smoke on Ubuntu 22.04
        run: xvfb-run -a npm run smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-evidence-modern
          path: artifacts/
          if-no-files-found: warn
  packages:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-legacy-x64
            runner: windows-2022
            platform: win
            arch: x64
            legacy: '1'
          - target: windows-modern-x64
            runner: windows-2022
            platform: win
            arch: x64
            legacy: '0'
          - target: ubuntu-amd64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            legacy: '0'
          - target: ubuntu-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            legacy: '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      LEGACY: ${{ matrix.legacy }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Select legacy runtime for real UI smoke
        if: matrix.legacy == '1'
        run: npm ci --prefix runtimes/legacy
      - name: Record legacy dependency audit (EOL runtime remains explicitly accepted)
        if: matrix.legacy == '1'
        continue-on-error: true
        shell: bash
        run: mkdir -p artifacts && npm audit --prefix runtimes/legacy --json > artifacts/legacy-dependency-audit.json
      - name: Real Windows runtime smoke
        if: matrix.platform == 'win'
        run: npm run smoke
      - name: Build unsigned installation packages
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Smoke the packaged Windows application
        if: matrix.platform == 'win'
        run: node scripts/packaged-smoke.mjs
      - name: Smoke the packaged Ubuntu amd64 application
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: xvfb-run -a node scripts/packaged-smoke.mjs
      - name: Ubuntu ARM64 22.04 source and packaged runtime baseline smoke
        if: matrix.arch == 'arm64'
        run: bash scripts/ubuntu-baseline.sh
      - name: SHA256 checksums
        shell: bash
        run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-reprint-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore
